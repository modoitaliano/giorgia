name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: giorgia
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Upgrade npm CLI for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Reject version already on npm
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          # A first publish under a new scope 404s, and a package with exactly one
          # version returns a bare string rather than an array. Treat both as "not published".
          PUBLISHED_VERSIONS=$(npm view @modoitaliano/giorgia versions --json 2>/dev/null || echo '[]')
          if [ -z "$PUBLISHED_VERSIONS" ]; then PUBLISHED_VERSIONS='[]'; fi
          VERSION_STATUS=$(node -e 'let v; try { v = JSON.parse(process.argv[1]); } catch { v = []; } if (typeof v === "string") v = [v]; if (!Array.isArray(v)) v = []; console.log(v.includes(process.argv[2]) ? "published" : "unpublished")' "$PUBLISHED_VERSIONS" "$VERSION")
          if [[ "$VERSION_STATUS" == published ]]; then
            echo "::error::@modoitaliano/giorgia@$VERSION is already on npm"
            exit 1
          fi
      - name: Verify release tag matches package version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Publish only from a version tag, not a branch"
            exit 1
          fi
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance

      - name: Verify registry
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          for ATTEMPT in 1 2 3 4 5; do
            LIVE_VERSION=$(npm view "@modoitaliano/giorgia@$VERSION" version 2>/dev/null || true)
            if [[ "$LIVE_VERSION" == "$VERSION" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::@modoitaliano/giorgia@$VERSION is not on the registry"
          exit 1

      - name: Summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: @modoitaliano/giorgia" >> $GITHUB_STEP_SUMMARY
          VERSION=$(node -p 'require("./package.json").version')
          echo "- **Version**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: npmjs" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Published" >> $GITHUB_STEP_SUMMARY
