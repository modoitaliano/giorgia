name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer styles for template tests
        run: npm run build:css

      - name: Unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

      - name: Verify the packed declarative contract as a consumer
        run: node scripts/verify-packed-contract.mjs
