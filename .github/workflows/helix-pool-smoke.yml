name: Helix pool smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, helix, pool]
    timeout-minutes: 5
    steps:
      - name: Verify Modoitaliano shared listener
        shell: bash
        run: |
          echo "runner=$RUNNER_NAME host=$(hostname -s)"
          test "$RUNNER_NAME" = "helix-org-modoitaliano"
          test "$(hostname -s)" = "actions-ci"

